<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Debates y Comunidad | Fresh Football</title>
    <meta name="description" content="Debates de fútbol, opiniones de LaLiga y foros en la comunidad de Fresh Football." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body class="bg-[#08090c] text-slate-100 flex flex-col min-h-screen">
    <header></header>

    <main class="flex-1 max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full space-y-8">
      <!-- Title & CTA -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-[#232838] pb-6">
        <div>
          <div class="text-[11px] font-bold text-neon uppercase tracking-wider">La Grada Virtual</div>
          <h1 class="text-2xl sm:text-3xl font-black text-white">Debates de la Comunidad</h1>
        </div>

        <button id="open-new-debate-btn" class="btn-neon text-xs py-2.5 px-4 self-start sm:self-auto">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          <span>Abrir Nuevo Debate</span>
        </button>
      </div>

      <!-- New Debate Form (hidden by default) -->
      <div id="new-debate-box" class="hidden fresh-card p-5 border-neon/40 space-y-4">
        <h3 class="text-sm font-bold text-white flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-neon"></span>
          <span>Iniciar un Nuevo Debate</span>
        </h3>
        <form id="new-debate-form" class="space-y-3">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Título del debate</label>
            <input type="text" id="debate-title-input" required placeholder="Ej: ¿Quién debe ser el delantero titular de LaLiga?" class="fresh-input text-xs" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Tu argumento o pregunta</label>
            <textarea id="debate-content-input" rows="4" required placeholder="Desarrolla tu punto de vista con argumentos futboleros..." class="fresh-input text-xs resize-none"></textarea>
          </div>
          <div class="flex justify-end gap-2">
            <button type="button" id="cancel-debate-btn" class="btn-secondary text-xs">Cancelar</button>
            <button type="submit" id="submit-debate-btn" class="btn-neon text-xs">Publicar Debate</button>
          </div>
        </form>
      </div>

      <!-- Debates Feed -->
      <div id="debates-feed" class="space-y-4">
        <div class="py-12 text-center text-xs text-slate-500">Cargando debates...</div>
      </div>
    </main>

    <footer></footer>

    <script type="module" src="/src/js/pages/comunidad.js"></script>
  </body>
</html>
