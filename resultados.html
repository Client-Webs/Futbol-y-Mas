<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resultados LaLiga | Fresh Football</title>
    <meta name="description" content="Marcadores, jornadas y resultados en directo de LaLiga española en Fresh Football." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body class="bg-[#08090c] text-slate-100 flex flex-col min-h-screen">
    <header></header>

    <main class="flex-1 max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full space-y-8">
      <!-- Title & Matchday Navigation -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-[#232838] pb-6">
        <div>
          <div class="text-[11px] font-bold text-neon uppercase tracking-wider">Competición Oficial</div>
          <h1 class="text-2xl sm:text-3xl font-black text-white">Resultados de LaLiga</h1>
        </div>

        <!-- Matchday Selector -->
        <div class="flex items-center gap-2">
          <button id="prev-matchday" class="p-2 bg-[#12151e] border border-[#232838] rounded-xl text-slate-300 hover:text-white hover:border-neon transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
          </button>
          
          <select id="matchday-select" class="fresh-input py-2 px-3 text-xs font-bold w-40 text-center">
            <!-- 1 to 38 -->
          </select>

          <button id="next-matchday" class="p-2 bg-[#12151e] border border-[#232838] rounded-xl text-slate-300 hover:text-white hover:border-neon transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
          </button>
        </div>
      </div>

      <!-- Quick Status Filters -->
      <div class="flex items-center gap-2" id="status-filters">
        <button data-status="all" class="px-3.5 py-1.5 rounded-lg text-xs font-bold bg-neon text-black">Todos los partidos</button>
        <button data-status="finished" class="px-3.5 py-1.5 rounded-lg text-xs font-bold bg-[#12151e] border border-[#232838] text-slate-300 hover:text-white">Finalizados</button>
        <button data-status="live" class="px-3.5 py-1.5 rounded-lg text-xs font-bold bg-[#12151e] border border-[#232838] text-slate-300 hover:text-white">En Vivo</button>
        <button data-status="scheduled" class="px-3.5 py-1.5 rounded-lg text-xs font-bold bg-[#12151e] border border-[#232838] text-slate-300 hover:text-white">Próximos</button>
      </div>

      <!-- Matches List Container -->
      <div id="matches-list" class="space-y-3">
        <div class="py-12 text-center text-xs text-slate-500">Cargando partidos de LaLiga...</div>
      </div>
    </main>

    <footer></footer>

    <script type="module" src="/src/js/pages/resultados.js"></script>
  </body>
</html>
